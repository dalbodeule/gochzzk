name: 기능 제안
description: 새로운 API 또는 개선 사항을 제안해 주세요.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 사용 사례가 현재 지원되지 않는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 API
      description: 원하는 메서드, 타입 또는 동작을 예시와 함께 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 CHZZK 공식 문서 링크가 있다면 작성해 주세요.
